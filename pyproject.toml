[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "second-mate"
version = "0.1.0"
description = "A lean, evidence-based coordinator for one supervised coding run"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Second Mate contributors" }]
dependencies = []

[project.scripts]
second-mate = "second_mate.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17",
  "pytest>=8.4",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/second_mate"]

[tool.hatch.build.targets.sdist]
include = [
  "/.gitignore",
  "/README.md",
  "/docs/second-mate/DIRECTION-OPERATOR.md",
  "/docs/second-mate/FS-01-OPERATOR.md",
  "/docs/second-mate/MS-02-OPERATOR-WALKTHROUGH.md",
  "/docs/second-mate/TRUSTED-LOCAL-OPERATOR.md",
  "/pyproject.toml",
  "/src/second_mate",
  "/tests",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["second_mate"]
exclude = ["tests/fixtures/"]
